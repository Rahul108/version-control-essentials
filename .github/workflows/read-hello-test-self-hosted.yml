name: Read hello.txt on Push to Main

on:
  push:
    branches:
      - dev

jobs:
  read-hello-file:
    runs-on: [self-hosted, ubuntu-desktop-personal]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display content of hello.txt
        run: |
          echo "=== Content of hello.txt ==="
          cat hello.txt
          echo ""
          echo "============================"
